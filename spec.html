  <div class="sub" style="margin-bottom:6px">다미스닷넷 · 표준거래처 등록(CM3010E) · 거래처 등록(CM3040E) · 상품 등록(CM2060E) · 5차안</div>
  <h1>제약사 반품조건 표준화 · 개발자용 항목 정의서</h1>
  <p style="margin-top:8px;color:#374151"><b>제약사 반품조건</b>(제약사가 동원약품그룹 유통사의 반품을 받아주는 조건)을 표준거래처(기획실) → 거래처(각사) → 상품(각사) 3단계로 연결하는 안입니다. 고객 반품을 막는 기존 판매반품금지 체크(全社)와는 따로 둡니다. 상품 등록 판매 영역은 기존 항목을 그대로 두고 ‘반품조건설명’ 칸만 바꿉니다. 유팜몰WOS 노출, 표시·적용일·회수는 범위에서 제외했습니다.</p>

        <tr><td>보상·정품·파손·소분·개봉</td><td class="r">616</td><td>조건: 상태별 공제·불가 (파손품 · 소분·낱개) / 개봉·보상 관련은 메모</td></tr>

        <tr><td>회수·판매중지(회수)</td><td class="r">3,653</td><td>구매비고 (반품조건 화면에서 제외)</td></tr>
        <tr><td>요청시발주·발주금지·발주보류</td><td class="r">7,000</td><td>구매비고</td></tr>

  <div class="sec">
    <h2>2. 3단계 구조</h2>
    <table>
      <thead><tr><th style="width:190px">화면</th><th style="width:150px">위치</th><th style="width:150px">관리 · 저장 단위</th><th>‘따름’을 고르면</th></tr></thead>
      <tbody>
        <tr><td>① 표준거래처 등록 (CM3010E)</td><td>추가정보 옆 ‘반품조건’ 탭 신설</td><td>기획실 · 표준거래처코드</td><td>(최상위 기준이라 ‘따름’ 없음)</td></tr>
        <tr><td>② 거래처 등록 (CM3040E)</td><td>추가정보 옆 ‘반품조건’ 탭 신설</td><td>각사 · 회사 + 거래처코드</td><td>‘표준거래처 반품조건 따름’: 같은 코드의 표준거래처 제약사 반품조건을 모든 항목 그대로 보여줌(수정 불가).<br><b>표준거래처가 반품불가면 ‘직접 입력’ 선택 불가</b>(항상 따름)</td></tr>
        <tr><td>③ 상품 등록 (CM2060E)</td><td>판매 영역 ‘반품조건설명’ 자리</td><td>각사 · 회사 + 상품코드</td><td>‘우선처 반품조건 따름’: 그 상품 우선처의 거래처 등록 제약사 반품조건을 보여줌. 거래처가 표준을 따르면 표준거래처 값</td></tr>
      </tbody>
    </table>
    <p class="sub" style="margin-top:6px">※ 거래처코드는 표준거래처코드(5자리)와 같으므로 같은 코드로 바로 연결됩니다. ‘직접 입력’으로 바꾸면 위 단계의 값이 복사된 상태에서 고칠 수 있습니다.</p>

  <div class="sec">
    <h2>3. 판매반품금지 체크(全社)와의 관계</h2>
    <table>
      <thead><tr><th style="width:160px">구분</th><th>제약사 반품조건 (이번에 신설)</th><th>판매반품금지 체크 (全社, 기존)</th></tr></thead>
      <tbody>
        <tr><td>누구와의 반품</td><td>우리 → 제약사 (매입 반품)</td><td>고객(약국·병원) → 우리 (판매 반품)</td></tr>
        <tr><td>누가 정하나</td><td>제약사 정책</td><td>동원약품그룹 영업 판단</td></tr>
        <tr><td>입력 위치</td><td>표준거래처 → 거래처 → 상품</td><td>표준상품 등록 (상품별)</td></tr>
        <tr><td>실제 동작</td><td>제약사 반품 처리 시 기준 정보</td><td>반품창고에서 고객 반품 접수 차단 (변경 없음)</td></tr>
      </tbody>
    </table>
    <ol class="ol" style="margin-top:12px">
      <li><b>하나로 합치지 않습니다.</b> 공제율 같은 제약사 조건은 고객 반품에 쓰지 않고, 반품창고 로직도 그대로 둡니다.</li>
      <li><b>표준거래처가 반품불가면 판매반품금지 체크(全社)를 함께 체크합니다.</b> 표준거래처 등록에서 반품불가로 저장하면, 그 제약사가 우선처인 모든 상품(8개 회사 전체)의 판매반품금지 체크(全社)를 자동으로 ‘체크’로 바꿉니다. 상품 등록 화면에서도 체크된 채 잠겨서 해제할 수 없습니다(‘표준거래처 반품불가 → 자동 체크 (해제 불가)’ 표시). 표준거래처 화면에서 반품불가를 고르면 이 내용을 빨간 글씨로 미리 알려 줍니다.</li>
      <li><b>표준거래처가 반품불가에서 다른 값으로 바뀌어도 자동으로 해제하지는 않습니다.</b> 고객 반품을 다시 받을지는 담당자가 상품별로 판단해 해제합니다.</li>
      <li><b>거래처·상품 단계에서만 반품불가인 경우는 경고합니다.</b> 표준거래처는 반품불가가 아닌데 거래처(우선처) 직접 입력이나 상품 직접 입력이 반품불가이고 판매반품금지 체크(全社)가 꺼져 있으면, 상품 등록 화면에 주황색 경고를 띄웁니다. 이 경우는 자동 체크하지 않고 담당자가 판단합니다. 판매반품금지는 그룹 전체(全社) 값이라 한 회사의 사정만으로 자동으로 바꾸지 않기 위해서입니다.</li>
      <li><b>불일치 목록을 조회합니다.</b> ‘제약사 반품불가 + 고객 반품 허용’ 상품 목록을 뷰로 제공해 반품 손실 위험 상품을 관리합니다. 표준거래처 반품불가는 자동 체크되므로 이 목록에는 거래처·상품 단계 반품불가만 남습니다.</li>
    </ol>
  </div>

  <div class="sec">
    <h2>4. 항목 정의서 (세 화면 공통)</h2>
    <p style="margin-bottom:10px">세 화면의 제약사 반품조건 입력 항목은 같습니다. 상품 등록 판매 영역의 全社판매비고, 當社판매비고, 판매반품금지 체크(全社), 온라인판매금지, 판매가능상품 체크, 1일판매제한수량, 병의원外판매금지, 全社판매금지일, 판매금지일, 판매반품금지일은 <b>변경 없음</b>.</p>

    <h2>6. 개발자와 함께 정해야 할 사항 (제안)</h2>
    <ol class="ol">
      <li><b>저장 단위.</b> 표준거래처는 ‘표준거래처코드’, 거래처는 ‘회사 + 지점 + 거래처코드’, 상품은 ‘회사 + 지점 + 상품코드’ 단위로 저장합니다. 기존 거래처·상품 마스터의 키와 똑같이 맞춘 것으로, 화면에서 지점별로 따로 입력하지는 않습니다(그 거래처·상품의 지점이 그대로 들어감). 상품코드가 법인마다 중복되는 것은 정상입니다.</li>
      <li><b>반품조건 탭 추가.</b> 표준거래처 등록(CM3010E)과 거래처 등록(CM3040E)의 추가정보 옆에 ‘반품조건’ 탭을 만듭니다. 탭 안 입력 상자 제목은 ‘제약사 반품조건’입니다. 별도 화면은 새로 만들지 않습니다.</li>
      <li><b>따름 해석 순서.</b> 상품(직접 입력이면 상품 값) → 우선처 거래처(직접 입력이면 거래처 값) → 표준거래처 값. 조회·엑셀용으로 이 결과를 한 번에 보여주는 뷰를 둡니다.</li>
      <li><b>윗단계가 바뀔 때 요약 갱신.</b> 표준거래처나 거래처를 저장하면, 그 값을 ‘따름’으로 쓰는 아래 거래처·상품의 요약과 기존 ‘반품조건설명’ 칸을 <b>같은 저장 안에서 한 번에</b> 다시 씁니다(중간에 실패하면 모두 취소). 기존 조회 화면·엑셀이 저장된 칸을 읽으므로 바로 맞아야 하기 때문입니다. 야간에는 어긋난 상품이 있는지 점검해 목록만 남기고 고치지는 않습니다.</li>
      <li><b>구매비고 분리 이관.</b> 반품조건 9,546행을 새 항목으로 옮기고, 다른 내용과 섞인 4,098행은 반품 부분만 떼어 옮긴 뒤 담당자가 검수합니다. 옮기지 못한 문구는 메모에 원문을 보존합니다.</li>
      <li><b>기호 의미 확인.</b> 중부의 * + # $, 헬스케어의 [회수], 제주의 ☆ ★ ♤처럼 회사마다 쓰는 기호의 뜻을 현업에 확인해야 자동 변환 규칙을 정할 수 있습니다.</li>
      <li><b>변경 이력.</b> 제약사 정책이 자주 바뀌므로 변경자·변경일시·이전 값을 저장합니다.</li>
    </ol>
