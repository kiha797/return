<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CM3011P 표준거래처 일괄수정</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:system-ui,sans-serif;font-size:14px}
body{margin:0}
.root{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:12px;color:#1c2433}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#1f2d4a;color:#fff;padding:10px 16px}
.chip{border:1px solid #8fa3c7;background:#2c3e63;color:#fff;font:inherit;padding:5px 12px;cursor:pointer;border-radius:2px;min-height:28px}
.chip:hover{background:#3b5183}
.chip.on{background:#c2410c;border-color:#c2410c;font-weight:700}
.pw{background:#6a92b8;border:1px solid #4d6f93;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.pt{background:#c9cfe3;color:#1c2433;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.pt b{font-weight:700}
.tb{display:flex;gap:6px;justify-content:flex-end;background:#d4dbe8;margin:6px;padding:5px 8px;border:1px solid #a9b6cb}
.tbtn{font:inherit;border:1px solid #8a97ad;background:#eef2f8;height:26px;min-width:76px;padding:0 10px;cursor:pointer;color:#1c2433}
.tbtn:hover{background:#dfe8f6}
.tbtn.pri{background:#1d4ed8;color:#fff;border-color:#1d4ed8;font-weight:700}
.tbtn.pri:disabled{background:#93a7d6;border-color:#93a7d6;cursor:default}
.fr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:3px 8px;color:#fff}
.fr .fl{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.fr .fl::before{content:"";width:4px;height:4px;background:#bfe0ff;display:inline-block}
input[type=text],select{font:inherit;box-sizing:border-box;border:1px solid #8a97ad;background:#fff;color:#1c2433;height:22px;padding:0 4px}
input[type=text]:disabled,select:disabled{background:#d6d9df;color:#374151}
input[type=text]:focus,select:focus,button:focus-visible{outline:2px solid #1d4ed8;outline-offset:-1px}
.num{width:52px;text-align:right}
.ck{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.ck input{margin:0;width:14px;height:14px}
.qf{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:4px 8px}
.qbtn{font:inherit;border:1px solid #9fb6d1;background:#e8f0fa;color:#1c2433;height:24px;padding:0 9px;cursor:pointer;border-radius:12px}
.qbtn b{font-weight:700;margin-left:3px}
.qbtn.on{background:#1f2d4a;color:#fff;border-color:#1f2d4a}
.grid{background:#fff;margin:0 6px;border:1px solid #8a97ad;height:330px;overflow:auto}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th{position:sticky;top:0;background:#f3f5fa;border-right:1px solid #d5dbe6;border-bottom:1px solid #b8c2d3;font-weight:400;height:26px;padding:0 4px;text-align:center;white-space:nowrap;overflow:hidden;z-index:1}
td{border-right:1px solid #e3e7ef;border-bottom:1px solid #e3e7ef;height:26px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tr.sel td{background:#e8f0ff}
tr.chg td{background:#fff7cc}
tr.chg.sel td{background:#fde68a}
tr.skip td{background:#f3f4f6;color:#6b7280}
.c{text-align:center}
.bdg{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:700;border:1px solid}
.bdg.ng{color:#b91c1c;background:#fef2f2;border-color:#fca5a5}
.bdg.cd{color:#1d4ed8;background:#eff6ff;border-color:#93c5fd}
.bdg.ok{color:#166534;background:#dcfce7;border-color:#86efac}
.bdg.no{color:#6b7280;background:#f3f4f6;border-color:#d1d5db}
.after{color:#1d4ed8;font-weight:700}
.skiptx{color:#9a3412}
.lock{color:#b91c1c}
.ap{display:grid;grid-template-columns:200px 290px minmax(0,1fr) 190px;gap:0;margin:6px;background:#d4dbe8;border:1px solid #a9b6cb}
.ap>div{padding:8px 10px;border-right:1px solid #b6c2d6}
.ap>div:last-child{border-right:none}
.ap h4{margin:0 0 6px 0;font-size:12px;font-weight:700;color:#1f2d4a;display:flex;align-items:center;gap:6px}
.no{display:inline-block;width:18px;height:18px;border-radius:9px;background:#c2410c;color:#fff;text-align:center;line-height:18px;font-size:11px;font-weight:700}
.big{font-size:22px;font-weight:700;color:#1d4ed8}
.lnk{font:inherit;background:none;border:none;color:#1d4ed8;text-decoration:underline;cursor:pointer;padding:0;margin-right:8px}
.seg{font:inherit;border:1px solid #6b7a96;background:#f3f6fb;color:#1c2433;height:28px;min-width:84px;cursor:pointer}
.seg.ng.on{background:#b91c1c;color:#fff;border-color:#b91c1c}
.seg.cd.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.seg.ok.on{background:#15803d;color:#fff;border-color:#15803d}
.seg.dim{background:#e5e7eb;color:#6b7280;border-color:#c4c9d1}
.er{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.hint{color:#4b5563;font-size:11px}
.btn{font:inherit;border:1px solid #8a97ad;background:#f3f6fb;height:22px;padding:0 8px;cursor:pointer;color:#1c2433}
.btn.sm{height:20px;padding:0 6px}
.msg{margin:0 6px 6px 6px;padding:6px 10px;background:#f0fdf4;border:1px solid #86efac;color:#14532d}
.msg.warn{background:#fff7ed;border-color:#fdba74;color:#7c2d12}
.note{background:#fff;border:1px solid #c7d0de;padding:12px 14px;margin-bottom:10px}
.note h3{margin:0 0 6px 0;font-size:13px;font-weight:700;color:#111827;display:flex;gap:8px;align-items:center}
.note p{margin:0;line-height:1.6;color:#374151}
.step{flex:none;width:22px;height:22px;border-radius:11px;background:#c2410c;color:#fff;font-weight:700;text-align:center;line-height:22px;font-size:12px}


:root{--nav-bg:#16233d;--nav-fg:#e8edf6;--nav-dim:#9fb0cc;--nav-on:#c2410c;--page-bg:#e9edf3;color-scheme:light}
html,body{background:var(--page-bg)}
.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--nav-bg);display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:13px}
.topnav b{color:var(--nav-fg);margin-right:10px;font-weight:700}
.topnav .nv{color:var(--nav-dim);text-decoration:none;padding:6px 10px;border:1px solid #33476b;border-radius:3px}
.topnav .nv:hover{color:var(--nav-fg);border-color:var(--nav-dim)}
.topnav .nv.on{color:#fff;background:var(--nav-on);border-color:var(--nav-on);font-weight:700}
.topnav .nv:focus-visible{outline:2px solid #fff;outline-offset:2px}
.topnav .note{color:var(--nav-dim);margin-left:auto;font-size:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--nav-bg)}
.stage{overflow-x:auto;-webkit-overflow-scrolling:touch}
</style>
</head>
<body>
<nav class="topnav" aria-label="시안 목록"><b>다미스 반품조건 시안</b><a class="nv" href="index.html">반품정보 시안</a><a class="nv on" href="cm3011p.html">CM3011P 표준거래처 일괄수정</a><a class="nv" href="cm3041p.html">CM3041P 거래처 일괄수정</a><a class="nv" href="cm2061p.html">CM2061P 상품 일괄수정</a><a class="nv" href="spec.html">개발자 설계서</a><span class="note">바로 눌러 볼 수 있는 보기 전용 · 예시 데이터</span></nav>
<div class="stage"><div id="app"></div></div>
<script type="text/plain" id="tpl">
<div class="root" style="width:1920px;box-sizing:border-box;background:#f4f6fa">

  <div class="bar">
    <b>CM3011P 표준거래처 반품정보 일괄수정</b>
    <span style="width:16px"></span>
    <span style="color:#cfd8e6">표준거래처 등록(CM3010E) → [일괄 수정] 버튼(신규) → CM3011P</span>
    <span style="flex-grow:1"></span>
    <button class="chip" type="button" onClick="{{reset}}">처음으로</button>
  </div>

  <div style="display:flex;gap:24px;align-items:flex-start;padding:20px">
    <div class="pw" style="width:1300px;flex:none">
      <div class="pt"><b>{{w.title}}</b><span>✕</span></div>
      <div class="tb">
        <span class="hint" style="margin-right:auto;align-self:center">{{w.topHint}}</span>
        <button class="tbtn" type="button">🔍 조회</button>
        <button class="tbtn pri" type="button" onClick="{{w.save}}" disabled="{{w.saveOff}}">💾 저장{{w.saveCnt}}</button>
        <button class="tbtn" type="button">엑셀</button>
      </div>

      <div class="fr">
        <sc-for list="{{w.filters}}" as="f" hint-placeholder-count="4">
          <span class="fl">{{f.label}}</span>
          <sc-if value="{{f.isGubn}}" hint-placeholder-val="{{false}}">
            <select value="{{w.gubn}}" onChange="{{w.onGubn}}" style="{{f.style}}">
              <option value="all">= 전체 =</option>
              <option value="rtnBan">반품금지 상품만</option>
              <option value="saleOk">판매가능 상품만</option>
              <option value="puOk">구매가능 상품만</option>
            </select>
          </sc-if>
          <sc-if value="{{f.isBase}}" hint-placeholder-val="{{false}}">
            <select value="{{w.base}}" onChange="{{w.onBase}}" style="{{f.style}}">
              <option value="all">= 전체 =</option>
              <option value="maker">제약사</option>
              <option value="prior">우선처</option>
            </select>
          </sc-if>
          <sc-if value="{{f.isComp}}" hint-placeholder-val="{{false}}">
            <span style="position:relative;display:inline-block">
              <input type="text" value="{{w.compQ}}" onChange="{{w.onCompQ}}" onFocus="{{w.onCompFocus}}" onClick="{{w.onCompClick}}" disabled="{{w.compOff}}" placeholder="5자리 코드 또는 이름" style="{{f.style}}" aria-label="제약사·우선처 찾기">
              <sc-if value="{{w.compOpen}}" hint-placeholder-val="{{false}}">
                <span style="position:absolute;left:0;top:23px;z-index:5;background:#fff;border:1px solid #8a97ad;box-shadow:0 2px 6px rgba(0,0,0,.2);min-width:220px;display:flex;flex-direction:column">
                  <sc-for list="{{w.compSugg}}" as="o" hint-placeholder-count="3">
                    <button type="button" onClick="{{o.pick}}" style="font:inherit;text-align:left;border:none;background:#fff;padding:4px 8px;cursor:pointer;color:#1c2433">{{o.t}}</button>
                  </sc-for>
                  <sc-if value="{{w.compNone}}" hint-placeholder-val="{{false}}"><span class="hint" style="padding:4px 8px">찾는 거래처가 없습니다</span></sc-if>
                </span>
              </sc-if>
            </span>
          </sc-if>
          <sc-if value="{{f.isPlain}}" hint-placeholder-val="{{true}}">
            <select style="{{f.style}}" disabled="{{f.off}}"><option>{{f.val}}</option></select>
          </sc-if>
        </sc-for>
        <sc-for list="{{w.checks}}" as="k" hint-placeholder-count="1">
          <label class="ck"><input type="checkbox" checked="{{k.on}}"> {{k.label}}</label>
        </sc-for>
      </div>

      <div class="qf">
        <span style="color:#fff;margin-right:4px">빠른 보기</span>
        <sc-for list="{{w.quick}}" as="q" hint-placeholder-count="5">
          <button class="{{q.cls}}" type="button" onClick="{{q.pick}}">{{q.label}}<b>{{q.cnt}}</b></button>
        </sc-for>
        <span style="flex-grow:1"></span>
        <span style="color:#fff">찾기</span>
        <input type="text" value="{{w.q}}" onChange="{{w.onQ}}" placeholder="코드 · 이름 바로 찾기" style="width:180px">
      </div>

      <div class="grid">
        <table>
          <colgroup>
            <col style="width:32px">
            <sc-for list="{{w.cols}}" as="h" hint-placeholder-count="6"><col style="{{h.style}}"></sc-for>
          </colgroup>
          <thead><tr>
            <th><input type="checkbox" checked="{{w.allOn}}" onChange="{{w.toggleAll}}" aria-label="전체 선택"></th>
            <sc-for list="{{w.cols}}" as="h" hint-placeholder-count="6"><th>{{h.label}}</th></sc-for>
          </tr></thead>
          <tbody>
            <sc-for list="{{w.rows}}" as="r" hint-placeholder-count="8">
              <tr class="{{r.cls}}">
                <td class="c"><input type="checkbox" checked="{{r.on}}" onChange="{{r.toggle}}" aria-label="선택"></td>
                <sc-for list="{{r.cells}}" as="x" hint-placeholder-count="6">
                  <td class="{{x.td}}" title="{{x.t}}"><span class="{{x.cls}}">{{x.t}}</span></td>
                </sc-for>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>

      <div class="ap">
        <div>
          <h4><span class="no">1</span>고르기</h4>
          <div>선택 <span class="big">{{w.selCnt}}</span> 건 <span class="hint">/ 조회 {{w.viewCnt}}건</span></div>
          <div style="margin-top:6px">
            <button class="lnk" type="button" onClick="{{w.selView}}">보이는 것 모두 선택</button>
            <button class="lnk" type="button" onClick="{{w.selNone}}">선택 해제</button>
          </div>
          <div class="hint" style="margin-top:6px">빠른 보기·찾기로 좁힌 뒤 ‘보이는 것 모두 선택’을 누르면 편합니다.</div>
        </div>
        <div>
          <h4><span class="no">2</span>바꿀 항목</h4>
          <div class="hint" style="margin-bottom:6px">▼를 눌러 바꿀 항목을 고르세요.</div>
          <sc-if value="{{w.isStdTab}}" hint-placeholder-val="{{true}}">
            <select value="{{w.item}}" onChange="{{w.onItem}}" style="width:100%;height:26px">
              <option value="type">반품구분</option>
              <option value="bands">유효기한별 공제</option>
              <option value="st">상태별 공제·불가</option>
              <option value="lim">반품한도</option>
            </select>
          </sc-if>
          <sc-if value="{{w.isCustTab}}" hint-placeholder-val="{{false}}">
            <select value="{{w.item}}" onChange="{{w.onItem}}" style="width:100%;height:26px">
              <option value="inherit">표준거래처 반품조건 따름으로 되돌리기</option>
              <option value="type">반품구분 (직접 입력)</option>
              <option value="bands">유효기한별 공제 (직접 입력)</option>
              <option value="st">상태별 공제·불가 (직접 입력)</option>
              <option value="lim">반품한도 (직접 입력)</option>
            </select>
          </sc-if>
          <sc-if value="{{w.isProdTab}}" hint-placeholder-val="{{false}}">
            <select value="{{w.topItem}}" onChange="{{w.onTopItem}}" style="width:100%;height:26px">
              <option value="rtnDate">반품금지일자</option>
              <option value="saleDate">판매금지일자</option>
              <option value="puDate">구매금지일자</option>
              <option value="dc">매입할인율(%)</option>
              <option value="rtn">반품정보 (기존 ‘반품조건설명’ 자리)</option>
            </select>
            <sc-if value="{{w.isRtnGroup}}" hint-placeholder-val="{{false}}">
              <div class="hint" style="margin:8px 0 4px 0;font-weight:700;color:#1f2d4a">반품정보에서 수정할 내용</div>
              <select value="{{w.item}}" onChange="{{w.onItem}}" style="width:100%;height:26px">
                <option value="inherit">우선처 반품조건 따름으로 되돌리기</option>
                <option value="type">반품구분 (직접 입력)</option>
                <option value="bands">유효기한별 공제 (직접 입력)</option>
                <option value="st">상태별 공제·불가 (직접 입력)</option>
                <option value="lim">반품한도 (직접 입력)</option>
              </select>
            </sc-if>
          </sc-if>
        </div>
        <div>
          <h4><span class="no">3</span>바꿀 값 <span class="hint" style="font-weight:400">— {{w.itemHint}}</span></h4>

          <sc-if value="{{e.isType}}" hint-placeholder-val="{{true}}">
            <div class="er">
              <sc-for list="{{e.segs}}" as="s" hint-placeholder-count="3">
                <button class="{{s.cls}}" type="button" onClick="{{s.pick}}">{{s.label}}</button>
              </sc-for>
            </div>
            <div class="hint">반품불가·반품가능으로 바꾸면 기존 조건은 지워집니다. 조건부반품은 기존 조건을 그대로 둡니다.</div>
          </sc-if>

          <sc-if value="{{e.isBands}}" hint-placeholder-val="{{false}}">
            <div class="er hint"><span style="width:142px">시작</span><span style="width:12px"></span><span style="width:142px">끝</span><span>공제율</span></div>
            <sc-for list="{{e.bands}}" as="b" hint-placeholder-count="2">
              <div class="er">
                <select value="{{b.fs}}" onChange="{{b.onFs}}" style="width:76px"><option value="제한없음">제한없음</option><option value="임박">임박</option><option value="경과">경과</option></select>
                <span style="display:inline-flex;gap:3px;align-items:center;width:62px"><sc-if value="{{b.fmShow}}" hint-placeholder-val="{{true}}"><input type="text" class="num" value="{{b.fm}}" onChange="{{b.onFm}}" style="width:34px">개월</sc-if></span>
                <span>~</span>
                <select value="{{b.ts}}" onChange="{{b.onTs}}" style="width:76px"><option value="임박">임박</option><option value="경과">경과</option><option value="제한없음">제한없음</option></select>
                <span style="display:inline-flex;gap:3px;align-items:center;width:62px"><sc-if value="{{b.tmShow}}" hint-placeholder-val="{{true}}"><input type="text" class="num" value="{{b.tm}}" onChange="{{b.onTm}}" style="width:34px">개월</sc-if></span>
                <input type="text" class="num" value="{{b.rate}}" onChange="{{b.onRate}}" placeholder="없음" style="width:44px">%
                <button class="btn sm" type="button" onClick="{{b.del}}">−</button>
              </div>
            </sc-for>
            <div class="er"><button class="btn sm" type="button" onClick="{{e.addBand}}">+ 구간 추가</button><span class="hint">※ 유효기한 당일 = 경과 0개월 · 표에 없는 기간은 반품불가 · 기존 유효기한별 공제를 이 값으로 바꿉니다</span></div>
          </sc-if>

          <sc-if value="{{e.isSt}}" hint-placeholder-val="{{false}}">
            <sc-for list="{{e.st}}" as="z" hint-placeholder-count="3">
              <div class="er">
                <span style="width:72px;font-weight:700">{{z.name}}</span>
                <input type="text" class="num" value="{{z.rate}}" onChange="{{z.onRate}}" disabled="{{z.ng}}" placeholder="기본" style="width:48px">%
                <label class="ck" style="margin-left:6px"><input type="checkbox" checked="{{z.ng}}" onChange="{{z.onNg}}"> 불가</label>
              </div>
            </sc-for>
            <div class="hint">공제율 빈칸 = 유효기한별 공제 그대로. 기존 상태별 값을 이 값으로 바꿉니다.</div>
          </sc-if>

          <sc-if value="{{e.isLim}}" hint-placeholder-val="{{false}}">
            <div class="er">
              <label class="ck"><input type="checkbox" checked="{{e.limNone}}" onChange="{{e.onLimNone}}"> 반품한도 없앰</label>
            </div>
            <div class="er">
              <select value="{{e.limBase}}" onChange="{{e.onLimBase}}" disabled="{{e.limNone}}" style="width:120px"><option value="연간 매입액">연간 매입액</option><option value="분기 매입액">분기 매입액</option><option value="담당자별 매출액">담당자별 매출액</option></select>
              의 <input type="text" class="num" value="{{e.limRate}}" onChange="{{e.onLimRate}}" disabled="{{e.limNone}}" style="width:48px"> % 까지
            </div>
          </sc-if>

          <sc-if value="{{e.isInherit}}" hint-placeholder-val="{{false}}">

    <div style="flex-grow:1;min-width:0">
      <div class="note"><h3><span class="step">★</span>어디에 붙나요</h3><p>{{w.where}}</p></div>

const ST = [['dmg', '파손품'], ['split', '소분·낱개']];

const D = p => Object.assign({ none: false, type: '', bands: [], st: stEmpty(), lim: null, memo: '' }, p || {});
const NONE = () => D({ none: true });
const clone = d => JSON.parse(JSON.stringify(d));

const bandTxt = b => (b.fs === '제한없음' && b.ts === '제한없음' ? '상관없이' : side(b.fs, b.fm) + ' ~ ' + side(b.ts, b.tm)) + ' ' + (b.rate !== '' && b.rate !== '0' ? b.rate + '% 공제' : '공제 없음');
function summary(d) {
  if (d.none) return '— (미입력)';
  const p = [];
  if (!d.type) p.push('반품가능');
  else if (d.type === 'ng') p.push('반품불가');

const TYPE_NM = { ng: '반품불가', cd: '조건부반품', ok: '반품가능', none: '미입력' };

  { id: '10610', name: '사아제약(주)', d: D({ type: 'cond', bands: [band({ fs: '경과', fm: '0', ts: '제한없음', tm: '', rate: '50' })] }) },

];
const CUST0 = () => STD0().map(s => ({ id: s.id, name: s.name, mode: s.id === '10422' ? 'custom' : 'inherit', d: s.id === '10422' ? D({ type: 'cond', bands: [band({ fs: '제한없음', fm: '', ts: '제한없음', tm: '', rate: '7' })] }) : NONE() }));
const PROD0 = () => [
  ['40810', '10299', '가브스메트정50/1000mg', '60정(PTP)', '전문', '보험'],
  ['48839', '10299', '가브스메트정50/500mg', '60정(PTP)', '전문', '보험'],
  ['36476', '10299', '가브스정50mg', '28정(PTP)', '전문', '보험'],
  ['17690', '10299', '나보반주사5mg', '5ml/1앰플', '전문', ''],
  ['40201', '10299', '니코틴엘껌2mg-민트향', '24정', '일반', ''],
  ['10099', '10299', '니코틴엘TTS10-동화', '7매', '일반', ''],
  ['A0105', '10301', '가나캡슐', '100C', '전문', '보험'],
  ['A0106', '10301', '가나시럽', '100mL', '일반', ''],
  ['A0533', '10888', '카타정', '500T', '전문', '보험']
].map(x => ({ id: x[0], prior: x[1], name: x[2], spec: x[3], etc: x[4], insu: x[5], ban: x[1] === '10301' && x[0] === 'A0105', rtnDate: x[0] === '40201' ? '2023-06-30' : '2999-12-31', saleDate: '2999-12-31', puDate: '2999-12-31', dc: x[4] === '일반' ? '3.00' : '', mode: 'inherit', d: NONE() }));

const ED0 = () => ({ dc: '', dcClear: false, type: 'cond', bands: [band({ rate: '20' })], st: stEmpty(), limNone: false, limBase: '연간 매입액', limRate: '0.5', memo: '', copyFrom: '', ban: true, date: '2026-12-31', saleable: true });
const RTN_ITEMS = { inherit: true, type: true, bands: true, st: true, lim: true };
const W0 = (rows, item) => ({ rows: rows, pend: {}, skip: {}, sel: {}, quick: 'all', q: '', item: item, ed: ED0(), msg: '', msgCls: 'msg' });

const ITEM_HINT = { puDate: '기존 항목 (구매금지일자)', dc: '기존 항목 (매입할인율)', type: '반품불가 · 조건부반품 · 반품가능', bands: '선택한 행의 유효기한별 공제를 이 표로 바꿈', st: '파손품 · 소분·낱개', lim: '반품한도만 바꿈 (다른 조건 그대로)', memo: '메모만 바꿈', copy: '원본의 반품조건 전체를 그대로 복사', inherit: '직접 입력을 지우고 윗단계 조건을 따름', ban: '고객 → 우리 반품 차단', rtnDate: '기존 항목 (반품금지일자)', saleDate: '기존 항목 (판매금지일자)' };

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.fresh('std');
  }
  fresh(tab) {
    return { tab: tab, std: W0(STD0(), 'lim'), cust: W0(CUST0(), 'inherit'), prod: W0(PROD0(), 'type') };
  }
  w(patch) { const t = this.state.tab; this.setState({ [t]: Object.assign({}, this.state[t], patch) }); }
  ed(patch) { const t = this.state.tab; this.w({ ed: Object.assign({}, this.state[t].ed, patch) }); }
  stdOf(id) { const s = this.state.std.rows.find(x => x.id === id); return s ? (this.state.std.pend[id] ? this.state.std.pend[id].d : s.d) : NONE(); }
  // 거래처 실제 값 (표준 반품불가면 항상 표준)
  custEff(id, row) {
    const std = this.stdOf(id);

    return row.d;
  }
  custRow(id) { const c = this.state.cust.rows.find(x => x.id === id); return c ? (this.state.cust.pend[id] || c) : null; }
  prodEff(row) { return row.mode === 'inherit' ? this.custEff(row.prior, this.custRow(row.prior)) : row.d; }

  // 선택한 행 1개에 바꿀 값을 적용한 결과 (건너뛰면 { skip: 이유 })
  applyOne(tab, row, item, ed, wst) {
    const nr = clone(row);
    const isStdNg = tab !== 'std' && this.stdOf(tab === 'cust' ? row.id : row.prior).type === 'ng';
    const base = tab === 'std' ? row.d : (tab === 'cust' ? this.custEff(row.id, row) : this.prodEff(row));
    const edit = fn => { const d = clone(base); d.none = false; fn(d); nr.d = d; if (tab !== 'std') nr.mode = 'custom'; return nr; };
    if (tab === 'cust' && isStdNg && item !== 'inherit') return { skip: '표준거래처 반품불가 (직접 입력 불가)' };
    if (item === 'inherit') { if (row.mode === 'inherit') return { skip: '이미 따름' }; nr.mode = 'inherit'; nr.d = NONE(); return nr; }
    if (item === 'rtnDate') { nr.rtnDate = ed.date; return nr; }
    if (item === 'saleDate') { nr.saleDate = ed.date; return nr; }
    if (item === 'puDate') { nr.puDate = ed.date; return nr; }
    if (item === 'dc') { nr.dc = ed.dcClear ? '' : ed.dc; return nr; }
    if (item === 'copy') {
      const src = wst.rows.find(x => x.id === ed.copyFrom);
      if (!src) return { skip: '원본 없음' };
      if (src.id === row.id) return { skip: '원본과 같은 행' };
      const sd = tab === 'std' ? src.d : (tab === 'cust' ? this.custEff(src.id, src) : this.prodEff(src));
      nr.d = clone(sd); if (tab !== 'std') nr.mode = 'custom'; return nr;
    }
    if (item === 'type') return edit(d => { d.type = ed.type === 'ok' ? '' : ed.type; if (d.type !== 'cond') { d.bands = []; d.st = stEmpty(); d.lim = null; } });
    if (item === 'bands') return edit(d => { d.type = 'cond'; d.bands = clone(ed.bands); });
    if (item === 'st') return edit(d => { d.type = 'cond'; d.st = clone(ed.st); });
    if (item === 'lim') return edit(d => { if (d.type !== 'cond') d.type = 'cond'; d.lim = ed.limNone ? null : { base: ed.limBase, rate: ed.limRate }; });
    if (item === 'memo') return edit(d => { d.memo = ed.memo; });
    return { skip: '-' };
  }

  renderVals() {
    const s = this.state, tab = s.tab, W = s[tab], E = W.ed;
    const cur = r => W.pend[r.id] || r;
    // ---- 행 표시용 값 ----
    const effOf = r => tab === 'std' ? cur(r).d : tab === 'cust' ? this.custEff(r.id, cur(r)) : this.prodEff(cur(r));
    const orig = r => tab === 'std' ? r.d : tab === 'cust' ? this.custEff(r.id, r) : this.prodEff(r);
    const qmatch = r => !W.q || (r.id + ' ' + r.name).indexOf(W.q) >= 0;
    const tOf = r => typeOf(orig(r));
    const quickDefs = [['all', '전체'], ['ng', '반품불가'], ['cd', '조건부반품'], ['ok', '반품가능'], ['none', '미입력']];
    if (tab !== 'std') quickDefs.push(['custom', '직접 입력']);
    if (tab === 'prod') quickDefs.push(['mis', '불일치 (제약사 반품불가 + 판매반품금지 해제)']);
    const qtest = (k, r) => k === 'all' || (k === 'custom' ? r.mode === 'custom' : k === 'mis' ? (tOf(r) === 'ng' && !r.ban) : tOf(r) === k);
    // CM2061P 조회구분 (기존과 같음) : 금지일자가 오늘 이전이면 금지된 것
    const TODAY = '2026-10-22';
    const gubnOk = r => { const g = W.gubn || 'saleOk'; if (tab !== 'prod' || g === 'all') return true;
      if (g === 'rtnBan') return r.rtnDate <= TODAY; if (g === 'saleOk') return r.saleDate > TODAY; return r.puDate > TODAY; };
    // CM2061P 상품기준 (= 전체 = / 제약사 / 우선처) + 거래처 칸 : 5자리 코드 직접 입력 또는 이름으로 찾기
    const compCd = W.compCd === undefined ? '10299' : W.compCd;
    const baseOk = r => tab !== 'prod' || (W.base || 'prior') === 'all' || !compCd || ((W.base || 'prior') === 'maker' ? (r.maker || r.prior) : r.prior) === compCd;
    const cq = (W.compQ || '').replace(/^\d{5}\)\s*/, '').trim();
    const compSugg = this.state.std.rows.filter(x => !cq || x.id.indexOf(cq) === 0 || x.name.indexOf(cq) >= 0).slice(0, 8)
      .map(x => ({ t: x.id + ') ' + x.name.replace('(주)', ''), pick: () => this.w({ compQ: x.id + ') ' + x.name.replace('(주)', ''), compCd: x.id, compOpen: false }) }));
    const visible = W.rows.filter(r => baseOk(r) && gubnOk(r) && qmatch(r) && qtest(W.quick, r));
    const selIds = W.rows.filter(r => W.sel[r.id]).map(r => r.id);
    const pendCnt = Object.keys(W.pend).length;

    const modeTxt = r => { if (tab === 'cust' && this.stdOf(r.id).type === 'ng') return '따름 🔒'; return r.mode === 'inherit' ? (tab === 'cust' ? '표준 따름' : '우선처 따름') : '직접 입력'; };
    let cols, cellsOf;
    if (tab === 'std') {
      cols = [['표준거래처코드', 100], ['제약사명', 130], ['반품구분', 86], ['반품조건 (현재)', 420], ['변경 후', 0]];

    } else if (tab === 'cust') {

    const W_ = {

      filters: filters.map(f => ({ label: f[0], val: f[1], style: f[2], off: tab === 'cust' && f[0] === '회사', isGubn: tab === 'prod' && f[0] === '조회구분', isBase: tab === 'prod' && f[0] === '상품기준', isComp: tab === 'prod' && f[0] === '', isPlain: !(tab === 'prod' && (f[0] === '조회구분' || f[0] === '상품기준' || f[0] === '')) })),

      selNone: () => this.w({ sel: {} }),
      isStdTab: tab === 'std', isCustTab: tab === 'cust', isProdTab: tab === 'prod',

      where: where
